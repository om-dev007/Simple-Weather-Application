<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/3f0fe3ab88.js" crossorigin="anonymous"></script>
    <title>Wheather App</title>
</head>

<body>

    <div class="error">Please enter a valid city</div>
    <div class="container">
        <div class="header">
            <div class="heading">
                <h1>Weather App</h1>
            </div>
        </div>
        <div class="main">
            <div class="input-sec">
                <input class="input-val" type="text" placeholder="Enter city name">
            </div>
            <div class="btn">
                <button>Get Weather</button>
            </div>
            <div class="data">
                <div class="get-data">
                    <div class="city-name">
                         <div class="city"></div>
                         <div class="country"></div>
                    </div>
                    <div class="not-main temp">
                        Temperature: <span class="temperature"></span>
                    </div>
                    <div class="weather-not-main">
                        Weather: <span class="weather"></span> 
                    </div>
                    <div class="not-main-wind">
                        Wind Speeed:  <span class="wind-speed"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
